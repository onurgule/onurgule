name: Update total stars badge

on:
  schedule:
    - cron: "0 3 * * *"   # daily
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compute total stars
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - << 'PY'
          import json, os, urllib.request

          user = "onurgule"
          token = os.environ.get("GH_TOKEN")

          def fetch(url):
            req = urllib.request.Request(url, headers={
              "Accept": "application/vnd.github+json",
              **({"Authorization": f"Bearer {token}"} if token else {})
            })
            with urllib.request.urlopen(req) as r:
              return json.loads(r.read().decode("utf-8"))

          total = 0
          page = 1
          while True:
            data = fetch(f"https://api.github.com/users/{user}/repos?per_page=100&page={page}")
            if not data:
              break
            for repo in data:
              total += int(repo.get("stargazers_count", 0))
            page += 1

          out = {
            "schemaVersion": 1,
            "label": "stars",
            "message": str(total),
            "color": "yellow",
            "cacheSeconds": 3600
          }

          os.makedirs("badges", exist_ok=True)
          with open("badges/total-stars.json", "w", encoding="utf-8") as f:
            json.dump(out, f)
          print("Total stars:", total)
          PY

      - name: Commit & push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add badges/total-stars.json
          git diff --cached --quiet || (git commit -m "chore: update total stars badge" && git push)
